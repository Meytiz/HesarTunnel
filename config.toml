[tunnel]
protocol = "tcp"
tunnel_port = 4000
remote_ip = "0.0.0.0"
config_ports = "8880"
secret_key = "your-secret-key"

# سرور خارج: آدرس forward به سرویس محلی (Xray)
# معمولاً 127.0.0.1 چون Xray روی همان سرور است
server_bind = "127.0.0.1"

# سرور ایران: آدرس listen برای کاربران  
# 0.0.0.0 = از همه جا قبول کن
client_forward = "0.0.0.0"

[crypto]
method = "chacha20-poly1305"
obfuscation = true
obfs_mode = "tls-hello"

[kcp]
preset = "fast2"
data_shard = 10
parity_shard = 3
snd_wnd = 1024
rcv_wnd = 1024
mtu = 1350
dscp = 46

[performance]
tunnel_count = 4
buffer_size = 32768
timeout = 30
keepalive = 10
no_delay = true
max_idle = 300
