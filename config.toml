[tunnel]
protocol = "tcp"
tunnel_port = 4000
remote_ip = "0.0.0.0"
config_ports = "80,443"
secret_key = "change-me-to-strong-key"

# Server (foreign): forward to local service address
server_bind = "127.0.0.1"

# Client (Iran): listen address for users
client_forward = "0.0.0.0"

[crypto]
method = "chacha20-poly1305"
obfuscation = true
obfs_mode = "tls-hello"

[kcp]
preset = "fast2"
data_shard = 10
parity_shard = 3
snd_wnd = 1024
rcv_wnd = 1024
mtu = 1350
dscp = 46

[performance]
tunnel_count = 4
buffer_size = 32768
timeout = 30
keepalive = 10
no_delay = true
max_idle = 300
